<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"/>
<body>
    <header th:replace="~{general/fragmentos :: header}"/>

    <main class="container py-5">
        <h2 class="text-center mb-5 section-title">[[#{index.productosDestacados}]]</h2>
        <div class="row g-4">
            <div th:each="p : ${productos}" class="col-md-4">
                <div class="card h-100 shadow-sm game-card">
                    <img th:src="@{${p.rutaImagen}}" class="card-img-top" alt="imagen del producto"/>
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">[[${p.nombre}]]</h5>
                        <p class="card-text text-muted text-truncate mb-3">[[${p.descripcion}]]</p>
                        <div class="mt-auto">
                            <span class="price-badge mb-2">&#8353; [[${p.precio}]]</span>
                            <p class="card-text mt-2 mb-0 small text-muted">
                                <i class="fas fa-tag me-1"></i>[[${p.categoria.nombre}]]
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="text-center p-4" th:if="${productos == null or productos.empty}">
            <span class="text-muted fs-5">[[#{lista.vacia}]]</span>
        </div>
    </main>

    <div th:replace="~{general/fragmentos :: mostrarToast}"/>
    <footer th:replace="~{general/fragmentos :: footer}"/>
</body>
</html>
