<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"/>
<body>
    <header th:replace="~{general/fragmentos :: header}"/>

    <main class="container py-5">
        <h2 class="text-center mb-4 section-title">[[#{config.titulo}]]</h2>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header modal-dark">
                        <h5 class="mb-0"><i class="fas fa-cog me-2"></i>[[#{config.datos}]]</h5>
                    </div>
                    <div class="card-body">
                        <form id="configForm" th:action="@{/admin/configuracion/guardar}" th:object="${tienda}" method="post">
                            <input type="hidden" th:field="*{idTienda}" />
                            <input type="hidden" th:field="*{activo}" />
                            <input type="hidden" th:field="*{usuario}" />

                            <div class="mb-3">
                                <label class="form-label fw-bold">[[#{config.nombre}]]</label>
                                <input type="text" class="form-control" th:field="*{nombreComercial}" required maxlength="150" />
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">[[#{config.descripcion}]]</label>
                                <textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">[[#{config.correo}]]</label>
                                    <input type="email" class="form-control" th:field="*{correoContacto}" maxlength="150" />
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">[[#{config.telefono}]]</label>
                                    <input type="text" class="form-control" th:field="*{telefonoContacto}" maxlength="20" />
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">[[#{config.moneda}]]</label>
                                <select class="form-select" th:field="*{moneda}" required>
                                    <option value="">-- [[#{config.moneda.seleccione}]] --</option>
                                    <option value="CRC">CRC - Colón Costarricense</option>
                                    <option value="USD">USD - Dólar Estadounidense</option>
                                    <option value="EUR">EUR - Euro</option>
                                    <option value="MXN">MXN - Peso Mexicano</option>
                                </select>
                            </div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-1"></i>[[#{accion.guardar}]]
                                </button>
                                <button type="submit" formaction="/admin/configuracion/preview" class="btn btn-outline-secondary">
                                    <i class="fas fa-eye me-1"></i>[[#{config.preview}]]
                                </button>
                            </div>
                        </form>

                        <hr/>

                        <form th:action="@{/admin/configuracion/restaurar}" method="post">
                            <button type="submit" class="btn btn-warning"
                                    onclick="return confirm('¿Desea restaurar los datos anteriores?')">
                                <i class="fas fa-undo me-1"></i>[[#{config.restaurar}]]
                            </button>
                        </form>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <a th:href="@{/admin/panel}" class="text-decoration-none">
                        <i class="fas fa-arrow-left me-1"></i>[[#{accion.regresar}]]
                    </a>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{general/fragmentos :: mostrarToast}"/>
    <footer th:replace="~{general/fragmentos :: footer}"/>
</body>
</html>
