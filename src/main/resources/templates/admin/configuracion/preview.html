<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"/>
<body>
    <div class="alert alert-info text-center mb-0 rounded-0" th:if="${esPreview}">
        <i class="fas fa-eye me-1"></i> <strong>[[#{config.preview.banner}]]</strong>
    </div>

    <nav class="navbar navbar-expand-sm navbar-dark bg-dark sticky-top shadow">
        <div class="container">
            <a href="#" class="navbar-brand">
                <i class="fas fa-store me-2"></i>[[${tienda.nombreComercial}]]
            </a>
        </div>
    </nav>

    <div class="hero-banner">
        <div class="container">
            <h1><i class="fas fa-store me-2"></i>[[${tienda.nombreComercial}]]</h1>
        </div>
    </div>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="mb-3">[[${tienda.nombreComercial}]]</h4>
                        <p th:if="${tienda.descripcion}" class="text-muted">[[${tienda.descripcion}]]</p>

                        <hr/>

                        <div class="row">
                            <div class="col-md-6" th:if="${tienda.correoContacto}">
                                <p><i class="fas fa-envelope me-2"></i>[[${tienda.correoContacto}]]</p>
                            </div>
                            <div class="col-md-6" th:if="${tienda.telefonoContacto}">
                                <p><i class="fas fa-phone me-2"></i>[[${tienda.telefonoContacto}]]</p>
                            </div>
                        </div>

                        <p class="mt-2">
                            <i class="fas fa-coins me-2"></i><strong>[[#{config.moneda}]]:</strong> [[${tienda.moneda}]]
                        </p>
                    </div>
                </div>

                <div class="d-flex gap-2 justify-content-center mt-4">
                    <form th:action="@{/admin/configuracion/guardar}" method="post">
                        <input type="hidden" name="idTienda" th:value="${tienda.idTienda}" />
                        <input type="hidden" name="nombreComercial" th:value="${tienda.nombreComercial}" />
                        <input type="hidden" name="descripcion" th:value="${tienda.descripcion}" />
                        <input type="hidden" name="correoContacto" th:value="${tienda.correoContacto}" />
                        <input type="hidden" name="telefonoContacto" th:value="${tienda.telefonoContacto}" />
                        <input type="hidden" name="moneda" th:value="${tienda.moneda}" />
                        <input type="hidden" name="activo" th:value="${tienda.activo}" />
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-check me-1"></i>[[#{config.publicar}]]
                        </button>
                    </form>
                    <a th:href="@{/admin/configuracion}" class="btn btn-outline-secondary">
                        <i class="fas fa-times me-1"></i>[[#{config.cancelar}]]
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{general/fragmentos :: footer}"/>
</body>
</html>
