<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Listado de Productos</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
        }

        .navbar {
            background-color: #1f3b5c;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 15px;
            background-color: #2d6cdf;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn:hover {
            background-color: #1b4fa8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.2);
        }

        th {
            background-color: #1f3b5c;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background-color: #f2f2f2;
        }

        .acciones a {
            margin: 0 5px;
            text-decoration: none;
            color: #2d6cdf;
            font-weight: bold;
        }

        .acciones a:hover {
            text-decoration: underline;
        }

        .estado-activo {
            color: green;
            font-weight: bold;
        }

        .estado-inactivo {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <h1>Administración de Productos</h1>
    </div>

    <div class="container">

        <!-- Botón crear -->
        <div class="top-bar">
            <h2>Lista de Productos</h2>
            <a href="/admin/productos/nuevo" class="btn">+ Nuevo Producto</a>
        </div>

        <!-- Tabla -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Categoría</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="p : ${productos}">
                    <td th:text="${p.idProducto}"></td>
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.precio}"></td>
                    <td>-</td>
                    <td th:text="${p.categoria != null ? p.categoria.nombre : 'Sin categoría'}"></td>

                    <!-- Estado -->
                    <td>
                        <span th:if="${p.activo}" class="estado-activo">Activo</span>
                        <span th:unless="${p.activo}" class="estado-inactivo">Inactivo</span>
                    </td>

                    <!-- Acciones -->
                    <td class="acciones">
                        <a th:href="@{'/admin/productos/editar/' + ${p.idProducto}}">Editar</a>
                        |

                        <a th:href="@{'/admin/productos/eliminar/' + ${p.idProducto}}"
                           onclick="return confirm('¿Seguro que deseas eliminar este producto?')">
                           Eliminar
                        </a>
                        |

                        <a th:href="@{'/admin/productos/activar/' + ${p.idProducto}}">
                            <span th:text="${p.activo ? 'Desactivar' : 'Activar'}"></span>
                        </a>
                    </td>
                </tr>

                <!-- Cuando no hay productos -->
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="7">No hay productos registrados</td>
                </tr>
            </tbody>
        </table>

    </div>

</body>
</html>
