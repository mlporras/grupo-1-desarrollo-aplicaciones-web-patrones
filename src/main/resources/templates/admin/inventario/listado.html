<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inventario</title>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f9;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #1f3b5c;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .low-stock {
            color: red;
            font-weight: bold;
        }

        input {
            width: 60px;
        }

        button {
            padding: 5px 10px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-back {
            padding: 10px 15px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-back:hover {
            background-color: #545b62;
        }
    </style>
</head>

<body>

<th:block th:with="puedeEscribir=${session.rolUsuario == 'ADMIN' or (session.rolUsuario == 'COLABORADOR' and session.rolColaborador == 'EDITOR')}">
<div class="container">

    <div class="top-bar">
        <h2>Inventario</h2>
        <a href="/admin/panel" class="btn-back">← Volver al Panel</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Stock</th>
                <th>Mínimo</th>
                <th>Alerta</th>
                <th th:if="${puedeEscribir}">Actualizar</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="inv : ${inventarios}">
                <td th:text="${inv.producto.nombre}"></td>

                <td th:text="${inv.stock}"></td>

                <td th:text="${inv.umbralMinimo}"></td>

                <!-- ALERTA -->
                <td>
                    <span th:if="${inv.stock <= inv.umbralMinimo}" class="low-stock">
                        Bajo
                    </span>
                    <span th:unless="${inv.stock <= inv.umbralMinimo}">
                        OK
                    </span>
                </td>

                <!-- FORM ACTUALIZAR -->
                <td th:if="${puedeEscribir}">
                    <form th:action="@{/admin/inventario/guardar}" method="post"
                          onsubmit="return confirm('¿Confirmar el nuevo stock: ' + this.querySelector('input[name=stock]').value + '?');">
                        <input type="hidden" name="idInventario" th:value="${inv.idInventario}" />
                        <input type="number" name="stock" th:value="${inv.stock}" min="0" required />
                        <button type="submit">Guardar</button>
                    </form>
                </td>
            </tr>
        </tbody>

    </table>

</div>
</th:block>

</body>
</html>
