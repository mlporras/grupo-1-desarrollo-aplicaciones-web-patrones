<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"/>
<body>
    <header th:replace="~{general/fragmentos :: header}"/>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header modal-dark">
                        <h5 class="mb-0">
                            <i class="fas fa-tags me-2"></i>
                            <span th:if="${cupon.idCupon == null}">[[#{cupon.nuevo}]]</span>
                            <span th:unless="${cupon.idCupon == null}">[[#{cupon.editar}]]</span>
                        </h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/cupones/guardar}" th:object="${cupon}" method="post">
                            <input type="hidden" th:field="*{idCupon}" />

                            <div class="mb-3">
                                <label class="form-label fw-bold">[[#{cupon.codigo}]]</label>
                                <input type="text" class="form-control" th:field="*{codigo}"
                                       required maxlength="50" style="text-transform:uppercase;" />
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">[[#{cupon.tipo}]]</label>
                                    <select class="form-select" th:field="*{tipoDescuento}" required>
                                        <option value="PORCENTAJE">Porcentaje (%)</option>
                                        <option value="MONTO_FIJO">Monto Fijo ($)</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">[[#{cupon.valor}]]</label>
                                    <input type="number" step="0.01" min="0.01"
                                           class="form-control" th:field="*{valor}" required />
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">[[#{cupon.fechaInicio}]]</label>
                                    <input type="date" class="form-control" th:field="*{fechaInicio}" required />
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">[[#{cupon.fechaFin}]]</label>
                                    <input type="date" class="form-control" th:field="*{fechaFin}" required />
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">[[#{cupon.usosMaximos}]]</label>
                                <input type="number" min="0" class="form-control" th:field="*{usosMaximos}" />
                                <small class="text-muted">0 = ilimitado</small>
                            </div>

                            <div class="mb-3">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" th:field="*{activo}" />
                                    <label class="form-check-label">Activo</label>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-save me-1"></i>[[#{accion.guardar}]]
                            </button>
                        </form>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <a th:href="@{/admin/cupones/listado}" class="text-decoration-none">
                        <i class="fas fa-arrow-left me-1"></i>[[#{accion.volverListado}]]
                    </a>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{general/fragmentos :: mostrarToast}"/>
    <footer th:replace="~{general/fragmentos :: footer}"/>
</body>
</html>
