<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"/>
<body>
    <header th:replace="~{general/fragmentos :: header}"/>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card shadow border-danger">
                    <div class="card-header bg-danger text-white">
                        <h3 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i>[[#{plan.suspendida.titulo}]]</h3>
                    </div>
                    <div class="card-body py-5">
                        <i class="fas fa-lock fa-4x text-danger mb-3"></i>
                        <h4>[[#{plan.suspendida.mensaje}]]</h4>
                        <p class="text-muted">[[#{plan.suspendida.detalle}]]</p>

                        <form th:action="@{/admin/planes/reactivar}" method="post" class="mt-4">
                            <button type="submit" class="btn btn-success btn-lg"
                                    onclick="return confirm('¿Simular pago y reactivar la tienda?')">
                                <i class="fas fa-credit-card me-1"></i>[[#{plan.reactivar}]]
                            </button>
                        </form>

                        <div class="mt-3">
                            <a th:href="@{/admin/planes/listado}" class="text-decoration-none">
                                [[#{plan.ver.planes}]]
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{general/fragmentos :: footer}"/>
</body>
</html>
