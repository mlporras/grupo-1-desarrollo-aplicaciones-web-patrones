<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"/>
<body>
    <header th:replace="~{general/fragmentos :: header}"/>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header modal-dark">
                        <h5 class="mb-0"><i class="fas fa-crown me-2"></i>[[#{plan.nuevo}]]</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/planes/guardar}" th:object="${plan}" method="post">
                            <input type="hidden" th:field="*{idPlan}" />

                            <div class="mb-3">
                                <label class="form-label fw-bold">[[#{plan.nombre}]]</label>
                                <input type="text" class="form-control" th:field="*{nombre}" required maxlength="100" />
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">[[#{plan.precio}]]</label>
                                <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{precioMensual}" required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">[[#{plan.descripcion}]]</label>
                                <textarea class="form-control" th:field="*{descripcion}" rows="2"></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">[[#{plan.maxProductos}]]</label>
                                    <input type="number" min="0" class="form-control" th:field="*{maxProductos}" />
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">[[#{plan.maxColaboradores}]]</label>
                                    <input type="number" min="0" class="form-control" th:field="*{maxColaboradores}" />
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" th:field="*{incluyeReportes}" />
                                    <label class="form-check-label">[[#{plan.incluyeReportes}]]</label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" th:field="*{incluyeCupones}" />
                                    <label class="form-check-label">[[#{plan.incluyeCupones}]]</label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" th:field="*{activo}" />
                                    <label class="form-check-label">Activo</label>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-save me-1"></i>[[#{accion.guardar}]]
                            </button>
                        </form>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <a th:href="@{/admin/planes/listado}" class="text-decoration-none">
                        <i class="fas fa-arrow-left me-1"></i>[[#{accion.regresar}]]
                    </a>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{general/fragmentos :: mostrarToast}"/>
    <footer th:replace="~{general/fragmentos :: footer}"/>
</body>
</html>
