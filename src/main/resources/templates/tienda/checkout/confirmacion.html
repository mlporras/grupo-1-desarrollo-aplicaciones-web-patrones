<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
    <header th:replace="~{general/fragmentos :: header}"></header>
    <main class="container py-5 text-center">
        <div class="py-5">
            <i class="fas fa-check-circle text-success fa-5x mb-4"></i>
            <h2 class="display-4">[[#{checkout.exito}]]</h2>
            <p class="lead">[[#{checkout.pedido.num}]] <strong th:text="${pedido.numeroPedido}"></strong></p>
            <p>Hemos recibido tu orden y la estamos procesando.</p>
            <a th:href="@{/tienda/catalogo}" class="btn btn-primary mt-4">Volver a la Tienda</a>
        </div>
    </main>
</body>
</html>
