<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"/>
<body>
    <header th:replace="~{general/fragmentos :: header}"/>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card shadow border-warning">
                    <div class="card-header bg-warning text-dark">
                        <h3 class="mb-0"><i class="fas fa-ban me-2"></i>[[#{acceso.denegado.titulo}]]</h3>
                    </div>
                    <div class="card-body py-5">
                        <i class="fas fa-lock fa-4x text-warning mb-3"></i>
                        <p class="lead">[[#{acceso.denegado.mensaje}]]</p>
                        <a th:href="@{/admin/panel}" class="btn btn-primary mt-3">
                            <i class="fas fa-arrow-left me-1"></i>[[#{accion.regresar}]]
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{general/fragmentos :: footer}"/>
</body>
</html>
