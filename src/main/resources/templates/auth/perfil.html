<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>
        
        <div th:replace="~{general/fragmentos :: mostrarToast}"></div>

        <section class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0"><i class="fas fa-user-edit me-2"></i>[[#{perfil.titulo}]]</h4>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/tienda/perfil/guardar}" method="POST">
                                <input type="hidden" name="idUsuario" th:value="${session.usuarioLogueado.idUsuario}" />
                                
                                <div class="row mt-3">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">[[#{usuario.nombre}]]</label>
                                        <input type="text" name="nombre" class="form-control" 
                                               th:value="${session.usuarioLogueado.nombre}" required />
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">[[#{usuario.correo}]]</label>
                                        <input type="email" name="correo" class="form-control" 
                                               th:value="${session.usuarioLogueado.correo}" required />
                                    </div>
                                </div>

                                <div class="alert alert-info small mt-2">
                                    <i class="fas fa-info-circle me-1"></i> 
                                    [[#{perfil.info.password}]]
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-bold">[[#{usuario.password}]]</label>
                                    <input type="password" name="contrasena" class="form-control" 
                                           placeholder="Dejar en blanco para mantener la actual" />
                                </div>

                                <div class="d-flex justify-content-between border-top pt-3">
                                    <a th:href="@{/tienda/catalogo}" class="btn btn-secondary">
                                        <i class="fas fa-arrow-left me-1"></i> [[#{accion.regresar}]]
                                    </a>
                                    <button type="submit" class="btn btn-success">
                                        <i class="fas fa-save me-1"></i> [[#{accion.guardar}]]
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
