<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"/>
<body>
    <header th:replace="~{general/fragmentos :: header}"/>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-header modal-dark text-center">
                        <h4 class="mb-0"><i class="fas fa-sign-in-alt me-2"></i>[[#{auth.iniciarSesion}]]</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/auth/login}" method="post">
                            <div class="mb-3">
                                <label for="correo" class="form-label">[[#{auth.correo}]]</label>
                                <input type="email" class="form-control" id="correo" name="correo"
                                       th:placeholder="#{auth.correo.placeholder}" required/>
                            </div>
                            <div class="mb-3">
                                <label for="contrasena" class="form-label">[[#{auth.contrasena}]]</label>
                                <input type="password" class="form-control" id="contrasena" name="contrasena"
                                       th:placeholder="#{auth.contrasena.placeholder}" required/>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-sign-in-alt me-1"></i>[[#{auth.iniciarSesion}]]
                                </button>
                            </div>
                        </form>
                        <hr/>
                        <div class="text-center">
                            <span>[[#{auth.noCuenta}]] </span>
                            <a th:href="@{/auth/registro}">[[#{auth.registrarse}]]</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-5 mt-4 mt-md-0">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-light">
                        <strong><i class="fas fa-info-circle me-2"></i>Credenciales de prueba</strong>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <div class="fw-bold">Admin</div>
                            <div><strong>Email:</strong> <code>admin@tienda.com</code></div>
                            <div><strong>Password:</strong> <code>admin123</code></div>
                            <div><strong>Role:</strong> <code>ADMIN</code></div>
                        </div>
                        <hr/>
                        <div class="mb-3">
                            <div class="fw-bold">Cliente 1</div>
                            <div><strong>Email:</strong> <code>carlos@correo.com</code></div>
                            <div><strong>Password:</strong> <code>cliente123</code></div>
                            <div><strong>Role:</strong> <code>CLIENTE</code></div>
                        </div>
                        <hr/>
                        <div>
                            <div class="fw-bold">Cliente 2</div>
                            <div><strong>Email:</strong> <code>maria@correo.com</code></div>
                            <div><strong>Password:</strong> <code>cliente123</code></div>
                            <div><strong>Role:</strong> <code>CLIENTE</code></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{general/fragmentos :: mostrarToast}"/>
    <footer th:replace="~{general/fragmentos :: footer}"/>
</body>
</html>
